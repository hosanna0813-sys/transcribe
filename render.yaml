services:
  - type: web
    name: transcribe-yt
    runtime: docker
    dockerfilePath: ./server/Dockerfile
    dockerContext: ./server
    plan: free
    healthCheckPath: /healthz
    autoDeploy: true
    # 計費版 v2 付費轉錄用的金鑰(值在 Render 後台填,不進 git;
    # 未設定時付費端點回錯,但免費 YouTube 服務照常運作)
    envVars:
      - key: OPENAI_API_KEY
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      # 階段三:家用中繼 ngrok 網址,供付費版 YouTube 下載(住宅 IP);
      # 未設定則 YouTube 來源停用,上傳仍可用
      - key: HOME_RELAY_URL
        sync: false
      # 階段五:每日免費額度(分鐘);未設定或 0 = 關閉免費試用
      - key: FREE_DAILY_MINUTES
        sync: false
