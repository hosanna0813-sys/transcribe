services:
  - type: web
    name: transcribe-yt
    runtime: docker
    dockerfilePath: ./server/Dockerfile
    dockerContext: ./server
    plan: free
    healthCheckPath: /healthz
    autoDeploy: true
    # 計費版 v2 付費轉錄用的金鑰(值在 Render 後台填,不進 git;
    # 未設定時付費端點回錯,但免費 YouTube 服務照常運作)
    envVars:
      - key: OPENAI_API_KEY
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      # 階段三:家用中繼 ngrok 網址,供付費版 YouTube 下載(住宅 IP);
      # 未設定則 YouTube 來源停用,上傳仍可用
      - key: HOME_RELAY_URL
        sync: false
      # 階段五:每日免費額度(分鐘);未設定或 0 = 關閉免費試用
      - key: FREE_DAILY_MINUTES
        sync: false
      # 首頁免費試用(免登入,由營運者金鑰付費):
      #   TRIAL_MINUTES           每個 IP 每日可試用的分鐘數(預設 10)
      #   TRIAL_DAILY_TOTAL_MINUTES 全站每日試用總量上限(預設 300,0=不限,保護荷包)
      # 未設 OPENAI_API_KEY 時試用自動停用
      - key: TRIAL_MINUTES
        sync: false
      - key: TRIAL_DAILY_TOTAL_MINUTES
        sync: false
      # 金流(綠界 ECPay);未設定則用綠界公開測試值,可先在測試環境試
      - key: ECPAY_MERCHANT_ID
        sync: false
      - key: ECPAY_HASH_KEY
        sync: false
      - key: ECPAY_HASH_IV
        sync: false
      - key: ECPAY_ENV            # stage(測試)/ production(正式)
        sync: false
      - key: PUBLIC_BASE_URL      # 本後端公開網址,例:https://transcribe-yt-j7kv.onrender.com
        sync: false
      - key: SITE_V2_URL          # 前端 v2 網址,例:https://hosanna0813-sys.github.io/transcribe/v2/
        sync: false
      # 環境:production 時金流缺正式金鑰會直接停用(不退回測試金鑰)、
      # PUBLIC_BASE_URL 必填;正式上線請設 production
      - key: APP_ENV
        sync: false
      # 家用中繼共享密鑰:與家用機 .env 的 RELAY_SHARED_SECRET 相同,
      # 後端對中繼的請求會帶 HMAC 簽章;未設定則不簽(中繼若強制驗證會拒絕)
      - key: RELAY_SHARED_SECRET
        sync: false
      # 遠端診斷 /diag 的權杖;未設定則 /diag 一律 404(建議平時不設)
      - key: DIAG_TOKEN
        sync: false
      # 中繼下載上限(bytes / 秒),未設用預設 512MB / 1800s
      - key: MAX_RELAY_DOWNLOAD_BYTES
        sync: false
      - key: MAX_RELAY_DOWNLOAD_SECONDS
        sync: false
      # 家用中繼:/audio 下載槽滿時最多等待秒數(預設 180);單次下載硬逾時(預設 1500)
      - key: RELAY_SLOT_WAIT_SECONDS
        sync: false
      - key: FETCH_MAX_SECONDS
        sync: false
      # 背景任務就地 Worker 同時處理數(免費方案單實例,預設 1;記憶體允許可調 2)
      - key: WORKER_CONCURRENCY
        sync: false
