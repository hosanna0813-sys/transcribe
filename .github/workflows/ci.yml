name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install ffmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - name: Install deps
        run: pip install -q -r server/requirements.txt pytest
      - name: Python syntax check
        run: python -m compileall -q server tests scripts
      - name: pytest
        run: python -m pytest tests/ -q
      - name: Security scan (pip-audit, 不阻擋)
        run: |
          pip install -q pip-audit
          pip-audit -r server/requirements.txt || true

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: JS syntax + 工具函式測試(含全形冒號)
        run: python3 scripts/check_frontend.py

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Docker build
        run: docker build -q ./server
